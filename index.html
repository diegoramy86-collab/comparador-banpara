<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comparativo Banpará</title>
<style>
:root{--bg:#0e141b;--card:#18222d;--line:#2b3846;--txt:#e9eef3;--muted:#9aa8b6;--gold:#d4a84b;--g:#1b5e3b;--y:#6b5200;--r:#6b1d1d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:16px 14px 8px;max-width:1100px;margin:auto}h1{font-size:18px;margin:0 0 6px}p{color:var(--muted);font-size:13px;line-height:1.45;margin:6px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;max-width:1100px;margin:8px auto;padding:0 12px}
.tabs button{background:#243140;border:0;color:#d7e0e8;padding:8px 10px;border-radius:8px;font-size:13px}
.tabs button.on{background:var(--gold);color:#1a1408;font-weight:700}
.search{max-width:1100px;margin:8px auto 12px;padding:0 12px}
.search input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#101820;color:var(--txt);font-size:15px}
section{display:none;max-width:1100px;margin:0 auto 40px;padding:0 10px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.card h3{margin:0 0 4px;font-size:14px}.meta{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;margin:0 4px 4px 0}
.ig{background:var(--g)}.pa{background:var(--y)}.ne{background:var(--r)}.val{color:var(--gold);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:#c5d0da;position:sticky;top:0;background:#151c24}tr.hid{display:none}.wrap{overflow-x:auto}
footer{max-width:1100px;margin:auto;padding:10px 14px 30px;color:var(--muted);font-size:11px}a{color:#d4a84b}
</style></head><body>
<header><h1>Teste online — comparativo Banpará</h1>
<p>Verde = compara direto. Amarelo = parece, olha a unidade. Vermelho = não compara. Banpará âncora 22/06/2026.</p></header>
<nav class="tabs">
<button class="on" data-t="rel">1. Relação</button>
<button data-t="comp">2. Oficiais cruzados</button>
<button data-t="pf">3. PF Banpará</button>
<button data-t="pj">4. PJ Banpará</button>
<button data-t="fontes">5. Fontes</button>
</nav>
<div class="search"><input id="q" type="search" placeholder="Buscar: TED, PIX, cadastro..."></div>
<section id="rel" class="on"></section><section id="comp"></section><section id="pf"></section><section id="pj"></section><section id="fontes"></section>
<footer>Âncora Banpará + sites que você passou + PDF/Bacen. PIX PF isento.</footer>
<script>
const REL=[["Essencial","1ª via cartão","IGUAL","Todos grátis","Sim","Só confirma isenção","PF"],["Essencial","Até 4 saques/mês","IGUAL","Franquia legal","Sim","Excedente = saque avulso","PF"],["Prioritário","Cadastro","IGUAL","Mesmo fato gerador","Sim","Uma vez no início","PF+PJ"],["Prioritário","2ª via débito","IGUAL","Perda/roubo/dano","Sim","Banpará 35 × BRB 9 × Banestes 10","PF"],["Prioritário","TED 3 canais","IGUAL","3 canais","Sim","Banpará é o mais caro no ranking BCB TED eletr.","PF+PJ"],["Prioritário","PIX PF","IGUAL","Proibido tarifar PF","Sim","Não misturar com PIX PJ","PF"],["PIX PJ","PIX envio PJ","PARECIDO","% com teto vs R$ fixo","Só convertendo","Testar R$100 / 1.000 / 10.000","PJ"],["Imóvel","Laudão / Fungetur","NÃO EQUIVALE","Produto Banpará","Não","Fora do ranking","PJ"]];
const COMP=[["PF cadastro","60,00","BRB ISENTO · Banestes/Banese/Itaú 30 · BASA 54","oficial"],["PF 2ª via débito","35,00","BRB 9 · Banestes 10 · BASA 11","oficial"],["PF TED eletrônico BCB","19 PDF / 17 BCB","BRB 9,40 · BASA 9,50 · BNB 11 · Itaú 11,10 · Safra 12 · Banestes/BB 13,10 · Banrisul/Banese 13,50 · Bradesco 13,85 · Santander 14,10 · Caixa 15","oficial BCB"],["PF PIX P2P","ISENTO","ISENTO em todos","oficial"],["PF anuidade básico","55,00","Bradesco 82,80 · Itaú 110,40 · BASA 126","oficial"],["PJ cadastro","69,00","Banestes 35 · BRB 41 · Banrisul 60 · BNB 200","oficial"],["PJ PIX envio","12,00 fixo","BNB/Banestes % com teto ~10","oficial"]];
const PF=[["Cadastro","60,00","prioritário"],["2ª via débito","35,00","prioritário"],["TED presencial / internet","27,00 / 19,00","prioritário"],["PIX app PF","ISENTO","prioritário"],["Anuidade básico","55,00","prioritário"]];
const PJ=[["Cadastro","69,00","cadastro"],["Manutenção 30d","81,00 / 42,00","manutenção"],["TED agência / internet","28 / 17","TED"],["PIX envio","12,00","PIX"]];
const FONTES=[["Banpará","https://www.banpara.b.br/","PDF PF/PJ que você enviou"],["Bradesco","https://banco.bradesco/html/classic/produtos-servicos/tarifas/index.shtm","Portal tarifas"],["BRB","https://novo.brb.com.br/","PDF PF 03/07/2026"],["Santander","https://www.santander.com.br/","TED eletr. 14,10 no BCB"],["Banrisul","https://www.banrisul.com.br/bob/site/link/home.html","Portal + BCB"],["Itaú","https://www.itau.com.br/","TED eletr. 11,10"],["BB","https://www.bb.com.br/","TED eletr. 13,10"],["Banestes","https://www.banestes.com.br/","PDF 30/04/2026"],["Caixa","https://www.caixa.gov.br/Paginas/home-caixa.aspx","PDF PF + BCB"],["Banese","https://www.banese.com.br/","PDF + BCB"],["Safra","https://www.safra.com.br/","PDF PJ + BCB"],["BNB","https://www.bnb.gov.br/","Pacotes de Tarifas"],["BASA","https://www.bancoamazonia.com.br/","Tarifas Bancárias + BCB"]];
function tag(t){if(t==="IGUAL")return'<span class="tag ig">IGUAL</span>';if(t==="PARECIDO")return'<span class="tag pa">PARECIDO</span>';if(t==="NÃO EQUIVALE")return'<span class="tag ne">NÃO EQUIVALE</span>';return t;}
function mountRel(){document.getElementById("rel").innerHTML=REL.map(r=>`<div class="card" data-s="${r.join(" ").toLowerCase()}"><h3>${r[1]} ${tag(r[2])}</h3><div class="meta">${r[0]} · ${r[6]}</div><p>Nos outros: ${r[3]}<br>Lança preço? <b>${r[4]}</b><br>${r[5]}</p></div>`).join("")}
function mountComp(){document.getElementById("comp").innerHTML='<div class="wrap"><table><thead><tr><th>Item</th><th>Banpará</th><th>Pares</th><th>Status</th></tr></thead><tbody>'+COMP.map(r=>`<tr data-s="${r.join(" ").toLowerCase()}"><td>${r[0]}</td><td class="val">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")+"</tbody></table></div>"}
function mountList(id,arr){document.getElementById(id).innerHTML='<div class="wrap"><table><thead><tr><th>Serviço</th><th>Tarifa</th><th>Grupo</th></tr></thead><tbody>'+arr.map(r=>`<tr data-s="${r.join(" ").toLowerCase()}"><td>${r[0]}</td><td class="val">${r[1]}</td><td>${r[2]}</td></tr>`).join("")+"</tbody></table></div>"}
function mountFontes(){document.getElementById("fontes").innerHTML='<div class="card"><h3>Base de pesquisa</h3><p>Home que você mandou + PDF/Bacen.</p></div>'+FONTES.map(r=>`<div class="card" data-s="${r.join(" ").toLowerCase()}"><h3>${r[0]}</h3><p><a href="${r[1]}">${r[1]}</a></p><p class="meta">${r[2]}</p></div>`).join("")}
mountRel();mountComp();mountList("pf",PF);mountList("pj",PJ);mountFontes();
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(b.dataset.t).classList.add("on")});
document.getElementById("q").oninput=e=>{const t=e.target.value.toLowerCase().trim();document.querySelectorAll("[data-s]").forEach(el=>{const show=!t||el.dataset.s.includes(t);if(el.tagName==="TR")el.classList.toggle("hid",!show);else el.style.display=show?"":"none"})};
</script></body></html>
